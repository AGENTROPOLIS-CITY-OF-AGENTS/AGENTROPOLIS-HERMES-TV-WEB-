name: Validate and publish static website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full main commit SHA explicitly authorized by NEURO for deployment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression checks
        run: python -m unittest discover -s tests -v
      - name: Build, validate links, security and accessibility baseline
        run: python scripts/site_build.py
      - name: HTTP smoke and exclusion checks
        run: python scripts/smoke.py
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approved_sha == github.sha
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
